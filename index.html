<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OmniFetch - Universal Video Downloader (YouTube, TikTok, Instagram)</title>
    <meta name="description" content="Download videos from YouTube, TikTok, and Instagram in 1080p Full HD, MP4, and MP3 audio with instant URL extraction." />
    <meta property="og:title" content="OmniFetch - Universal Video Downloader" />
    <meta property="og:description" content="Download videos from YouTube, TikTok, and Instagram in 1080p Full HD, MP4, and MP3 audio with instant URL extraction." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      // Ignore WebSocket disconnection errors in sandboxed dev environment
      window.addEventListener('unhandledrejection', function (e) {
        if (e.reason && (
          (e.reason.message && e.reason.message.includes('WebSocket')) ||
          (e.reason.stack && (e.reason.stack.includes('@vite/client') || e.reason.stack.includes('WebSocket')))
        )) {
          e.preventDefault();
          e.stopPropagation();
        }
      });
      window.addEventListener('error', function (e) {
        if ((e.message && e.message.includes('WebSocket')) ||
            (e.filename && e.filename.includes('@vite/client'))) {
          e.preventDefault();
          e.stopPropagation();
        }
      });
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased selection:bg-indigo-500 selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
